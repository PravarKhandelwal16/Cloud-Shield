<text x="475" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#356ee6" dominant-baseline="text-before-edge">FLASK TELEMETRY PIPELINE · ONE ATOMIC SQLITE TRANSACTION</text>
<rect x="85" y="670" width="335" height="185" rx="16" fill="#fff" stroke="#d9e2ef" stroke-width="2"/>
<text x="107" y="687" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#356ee6" dominant-baseline="text-before-edge">01 · COLLECTION</text>
<text x="107" y="715" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#182b49" dominant-baseline="text-before-edge">Normalize + log</text>
<text x="107" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Request ID, UTC time, IP / user</text>
<text x="107" y="783" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Route, status, outcome</text>
<text x="107" y="811" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Allowlisted metadata only</text>
<rect x="470" y="670" width="335" height="185" rx="16" fill="#fff" stroke="#d9e2ef" stroke-width="2"/>
<text x="492" y="687" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#356ee6" dominant-baseline="text-before-edge">02 · DETECTION</text>
<text x="492" y="715" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#182b49" dominant-baseline="text-before-edge">Evaluate four rules</text>
<text x="492" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Failed logins; rapid requests</text>
<text x="492" y="783" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Restricted access; new context</text>
<text x="492" y="811" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Windows, cooldowns, evidence</text>
<rect x="855" y="670" width="350" height="185" rx="16" fill="#fff" stroke="#d9e2ef" stroke-width="2"/>
<text x="877" y="687" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#356ee6" dominant-baseline="text-before-edge">03 · RISK SCORING</text>
<text x="877" y="715" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#182b49" dominant-baseline="text-before-edge">Explainable risk 0–100</text>
<text x="877" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Separate IP + verified-user scores</text>
<text x="877" y="783" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Finding weights + quiet reductions</text>
<text x="877" y="811" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Effective risk = higher score</text>
<rect x="1255" y="670" width="455" height="185" rx="16" fill="#fff" stroke="#d9e2ef" stroke-width="2"/>
<text x="1277" y="687" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#b65e16" dominant-baseline="text-before-edge">04 · INCIDENTS + RESPONSE</text>
<text x="1277" y="715" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#182b49" dominant-baseline="text-before-edge">Decide + record actions</text>
<text x="1277" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Group evidence into IP incident timelines</text>
<text x="1277" y="783" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Monitor / alert / temporary block</text>
<text x="1277" y="811" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Five-minute block on subsequent requests</text>
