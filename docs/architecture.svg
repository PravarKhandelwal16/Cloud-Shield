<text x="497" y="1092" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Users · events · findings · source history · versioned configuration</text>
<text x="497" y="1120" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Risk ledger · incidents · alerts · blocks · action audits</text>
<rect x="1255" y="1007" width="455" height="145" rx="16" fill="#fff" stroke="#d9e2ef" stroke-width="2"/>
<text x="1277" y="1024" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#356ee6" dominant-baseline="text-before-edge">ADMIN-ONLY DASHBOARD + JSON APIS</text>
<text x="1277" y="1052" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#182b49" dominant-baseline="text-before-edge">Investigate + acknowledge</text>
<text x="1277" y="1092" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Risk charts, evidence and incident timelines</text>
<text x="1277" y="1120" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Browser polls /api/dashboard every 5s</text>
