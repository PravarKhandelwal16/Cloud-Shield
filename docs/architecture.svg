<text x="75" y="1200" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#356ee6" dominant-baseline="text-before-edge">POLICY</text>
<text x="75" y="1226" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Versioned rules.json + policy.json</text>
<text x="610" y="1200" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#128479" dominant-baseline="text-before-edge">OPERATIONS</text>
<text x="610" y="1226" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Daily database backups · audited recovery CLI</text>
<text x="1245" y="1200" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#b65e16" dominant-baseline="text-before-edge">DEFAULT RESPONSE LEVELS</text>
<text x="1245" y="1226" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">0–24 allow · 25–49 monitor</text>
<text x="1245" y="1254" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">50–74 alert · 75–100 alert + block</text>
<text x="75" y="1289" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Scope: application-level protection. CAPTCHA is recommended; email, WAF/IAM, ML and multi-cloud integrations are future work.</text>
