<text x="330" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Solution architecture</text>
<text x="65" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#526580" dominant-baseline="text-before-edge">Application telemetry → explainable risk → adaptive response</text>
